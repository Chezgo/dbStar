services:
  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: имя_бд
      POSTGRES_USER: имя_пользователя
      POSTGRES_PASSWORD: пароль_БД
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backup.sql:/docker-entrypoint-initdb.d/backup.sql
    ports:
      - "5432:5432"

volumes:
  postgres_data: